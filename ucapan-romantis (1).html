<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>For Someone Special ❤️</title>
  <meta name="theme-color" content="#ffe4ea">
  <meta name="description" content="Sebuah hadiah digital kecil, dibuat dengan sepenuh hati.">

  <!-- Font: Great Vibes (tulisan tangan elegan), Caveat (catatan tangan),
       Cormorant Garamond (serif lembut), Jost (modern) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
/* =========================================================
   FOR SOMEONE SPECIAL  —  style.css
   Palet: pink pastel, putih, cream, merah muda.
   Daftar isi:
   1. Variabel & reset        6. Galeri polaroid
   2. Latar & kanvas          7. Penutup
   3. Tombol                  8. Amplop & surat
   4. Halaman pembuka         9. Lightbox & tirai
   5. Ucapan & kartu          10. Animasi & responsif
   ========================================================= */

/* ---------- 1. Variabel & reset ---------- */
:root {
  /* Warna — ubah di sini untuk mengganti suasana */
  --cream: #fffaf3;
  --blush: #fff1f4;
  --pink-100: #ffe4ea;
  --pink-200: #ffd0dc;
  --pink-300: #f9aec2;
  --rose: #ec6f8e;
  --red: #d6455f;
  --ink: #6a4553;
  --ink-soft: #9a7482;

  /* Font */
  --font-script: 'Great Vibes', 'Snell Roundhand', cursive;
  --font-hand: 'Caveat', 'Segoe Script', cursive;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  --font-sans: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --shadow: 0 18px 50px -18px rgba(214, 69, 95, .35);
  --ease: cubic-bezier(.22, .8, .26, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }

html {
  scroll-behavior: smooth;           /* gulir halus */
  -webkit-text-size-adjust: 100%;
  background: var(--cream);
}

body {
  font-family: var(--font-sans);
  font-weight: 300;
  color: var(--ink);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}
body.locked, body.no-scroll { overflow: hidden; }

button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; }

/* ---------- 2. Latar & kanvas ---------- */
body::before {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(60vmax 60vmax at 12% 8%, rgba(255, 205, 220, .55), transparent 60%),
    radial-gradient(55vmax 55vmax at 92% 88%, rgba(255, 226, 200, .45), transparent 60%),
    linear-gradient(160deg, var(--cream), var(--blush) 60%, #ffe8ee);
}

#fx {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 1;
}

.screen {
  position: relative; z-index: 2;
  min-height: 100vh; min-height: 100svh;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center;
  padding: clamp(72px, 11vh, 120px) 20px clamp(72px, 11vh, 110px);
}

.eyebrow {
  font: 500 .72rem/1 var(--font-sans);
  letter-spacing: .38em; text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: .9rem;
}
.section-title {
  font-family: var(--font-script); font-weight: 400;
  font-size: clamp(2.8rem, 9vw, 4.8rem);
  color: var(--red); line-height: 1.1;
  text-shadow: 0 6px 24px rgba(214, 69, 95, .18);
}
.sub {
  max-width: 34rem; margin-top: .6rem;
  font: italic 400 clamp(1.1rem, 2.6vw, 1.3rem)/1.6 var(--font-serif);
  color: var(--ink-soft);
}
.hint { margin-top: 2.2rem; font-size: .85rem; color: var(--ink-soft); letter-spacing: .04em; }

/* Efek muncul saat digulir */
.reveal {
  opacity: 0; transform: translateY(34px);
  transition: opacity 1s var(--ease), transform 1s var(--ease);
  transition-delay: var(--d, 0s);
}
.reveal.visible { opacity: 1; transform: none; }

/* Pemisah ornamen */
.divider {
  display: flex; align-items: center; gap: 14px;
  width: min(240px, 60%); margin: 1.4rem auto;
  color: var(--rose); font-size: .9rem;
}
.divider::before, .divider::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--pink-300), transparent);
}

/* Panah gulir */
.scroll-cue {
  position: absolute; bottom: 26px; left: 50%;
  width: 28px; height: 28px; margin-left: -14px;
  display: grid; place-items: center;
  opacity: .7; transition: opacity .3s, transform .3s var(--ease);
}
.scroll-cue span {
  width: 10px; height: 10px;
  border-right: 2px solid var(--rose); border-bottom: 2px solid var(--rose);
  transform: rotate(45deg); animation: nudge 2s ease-in-out infinite;
}
.scroll-cue:hover { opacity: 1; transform: translateY(3px); }

/* Tombol musik */
.music-btn {
  position: fixed; top: 14px; right: 14px; z-index: 30;
  display: flex; align-items: center; gap: .6rem;
  padding: .6rem 1.05rem .6rem .9rem;
  border-radius: 999px; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, .9);
  background: rgba(255, 255, 255, .72);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  color: var(--ink); font: 500 .78rem var(--font-sans); letter-spacing: .08em;
  box-shadow: 0 8px 24px -10px rgba(214, 69, 95, .45);
  transition: transform .3s var(--ease), box-shadow .3s;
}
.music-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 12px 28px -10px rgba(214, 69, 95, .6); }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.eq i { width: 3px; height: 4px; background: var(--rose); border-radius: 2px; }
.music-btn.playing .eq i { animation: eq .9s ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: -.3s; }
.eq i:nth-child(3) { animation-delay: -.6s; }

/* ---------- 3. Tombol ---------- */
.btn {
  position: relative; overflow: hidden;
  border: 0; cursor: pointer;
  padding: 1.05rem 2.3rem; border-radius: 999px;
  font: 500 .95rem/1 var(--font-sans); letter-spacing: .1em;
  color: #fff;
  background: linear-gradient(135deg, #f58aa5, var(--red));
  box-shadow: 0 12px 30px -10px rgba(214, 69, 95, .7);
  transition: transform .35s var(--ease), box-shadow .35s var(--ease);
}
.btn::after {                        /* kilau saat hover */
  content: ""; position: absolute; top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent);
  transform: skewX(-20deg); transition: left .7s var(--ease);
}
.btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 18px 36px -12px rgba(214, 69, 95, .8); }
.btn:hover::after { left: 130%; }
.btn:active { transform: scale(.97); }
.btn-ghost {
  color: var(--red); background: rgba(255, 255, 255, .8);
  border: 1px solid var(--pink-200);
  box-shadow: 0 10px 26px -14px rgba(214, 69, 95, .5);
}

/* ---------- 4. Halaman pembuka ---------- */
.intro > * { opacity: 0; animation: fadeUp 1.2s var(--ease) forwards; }
.intro > :nth-child(1) { animation-delay: .1s; }
.intro > :nth-child(2) { animation-delay: .4s; }
.intro > :nth-child(3) { animation-delay: .8s; }
.intro > :nth-child(4) { animation-delay: 1.1s; }
.intro > :nth-child(5) { animation-delay: 1.6s; }
.intro > :nth-child(6) { animation-delay: 2s; }

.beat-heart {
  font-size: 2.6rem; color: var(--rose); margin-bottom: .6rem;
  animation: fadeUp 1.2s var(--ease) .1s forwards, beat 1.6s ease-in-out 1.3s infinite;
  filter: drop-shadow(0 8px 14px rgba(214, 69, 95, .35));
}
.intro-title {
  font-family: var(--font-script); font-weight: 400;
  font-size: clamp(3.2rem, 13vw, 7rem); line-height: 1.05;
  color: var(--red);
  text-shadow: 0 8px 30px rgba(214, 69, 95, .22);
}
.intro-title .emoji { font-size: .6em; display: inline-block; animation: beat 1.6s ease-in-out infinite; }
.intro-line {
  max-width: 30rem; margin-bottom: 2.2rem;
  font: italic 400 clamp(1.15rem, 3vw, 1.45rem)/1.7 var(--font-serif);
  color: var(--ink);
}
.intro-hint { margin-top: 1.2rem; font-size: .78rem; letter-spacing: .12em; color: var(--ink-soft); }

/* ---------- 5. Ucapan & kartu ---------- */
.couple {
  margin-top: .8rem;
  font: 400 clamp(1.7rem, 5vw, 2.4rem)/1.2 var(--font-serif);
  color: var(--ink);
}
.couple .amp { font-family: var(--font-script); color: var(--rose); font-size: 1.3em; padding: 0 .15em; }
.date { margin: .3rem 0 2rem; font-size: .82rem; letter-spacing: .3em; text-transform: uppercase; color: var(--ink-soft); }

.card {
  background: rgba(255, 255, 255, .64);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border: 1px solid rgba(255, 255, 255, .9);
  border-radius: 28px; box-shadow: var(--shadow);
}
.greeting-card {
  position: relative;
  width: min(100%, 680px);
  padding: clamp(30px, 6vw, 56px) clamp(22px, 6vw, 56px);
  cursor: default;
}
.greeting-card::before, .greeting-card::after {
  content: "❤"; position: absolute; color: var(--pink-300); font-size: 1rem;
}
.greeting-card::before { top: 16px; left: 22px; }
.greeting-card::after { bottom: 16px; right: 22px; }

.typed-text p {
  margin-bottom: 1.1em;
  font: 400 clamp(1.2rem, 2.8vw, 1.42rem)/1.75 var(--font-serif);
  color: var(--ink);
}
.typed-text .g { visibility: hidden; }   /* teks cadangan agar tinggi kartu tetap stabil */
.typed-text p.is-typing .t::after {
  content: ""; display: inline-block; width: 2px; height: 1.1em;
  margin-left: 2px; vertical-align: -.15em;
  background: var(--rose); animation: blink .8s steps(1) infinite;
}
.signature {
  font-family: var(--font-script); font-size: clamp(1.9rem, 5vw, 2.4rem);
  color: var(--red); margin-top: .4rem;
  opacity: 0; transform: translateY(10px);
  transition: opacity 1s var(--ease), transform 1s var(--ease);
}
.signature.show { opacity: 1; transform: none; }

/* ---------- 6. Galeri polaroid ---------- */
.gallery-grid {
  width: min(100%, 1020px); margin-top: 2.4rem;
  display: grid; gap: 34px 28px;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
}
.pol-wrap { /* pembungkus supaya efek reveal & rotasi polaroid tidak bertabrakan */
  display: flex; justify-content: center;
}
.polaroid {
  position: relative; width: 100%; max-width: 280px;
  padding: 12px 12px 0; background: #fff; border-radius: 4px;
  box-shadow: 0 14px 30px -14px rgba(106, 69, 83, .4), 0 2px 6px rgba(106, 69, 83, .08);
  transform: rotate(var(--rot, 0deg));
  transition: transform .55s var(--ease), box-shadow .55s var(--ease);
  cursor: pointer; text-align: center;
}
.polaroid::before {                   /* selotip */
  content: ""; position: absolute; top: -11px; left: 50%;
  width: 74px; height: 22px; margin-left: -37px;
  background: rgba(255, 205, 220, .72); transform: rotate(-3deg);
  box-shadow: 0 1px 3px rgba(0, 0, 0, .06);
}
.polaroid:hover, .polaroid:focus-visible {
  transform: rotate(0deg) translateY(-10px) scale(1.04);
  box-shadow: 0 28px 44px -18px rgba(214, 69, 95, .5), 0 4px 10px rgba(106, 69, 83, .1);
  z-index: 3;
}
.photo {
  position: relative; aspect-ratio: 1 / 1; overflow: hidden;
  background: linear-gradient(135deg, var(--pink-100), #fff3e8);
}
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s var(--ease); }
.polaroid:hover .photo img { transform: scale(1.08); }
.photo-empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .5rem;
  color: var(--rose); font-size: .78rem; letter-spacing: .08em;
}
.photo-empty b { font-size: 2.2rem; font-weight: 400; animation: beat 2.2s ease-in-out infinite; }
.change-photo {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, .85); color: var(--red); font-size: .9rem;
  box-shadow: 0 4px 10px rgba(0, 0, 0, .12);
  opacity: 0; transition: opacity .3s;
}
.polaroid:hover .change-photo, .change-photo:focus-visible { opacity: 1; }
@media (hover: none) { .change-photo { opacity: .85; } }
.polaroid figcaption {
  padding: 14px 6px 18px; min-height: 4.4em;
  font: 500 1.35rem/1.25 var(--font-hand); color: var(--ink);
}

/* ---------- 7. Penutup ---------- */
.finale-title {
  max-width: 14ch; /* paksa pecah baris yang cantik */
  font-family: var(--font-script); font-weight: 400;
  font-size: clamp(2.8rem, 10vw, 5.4rem); line-height: 1.15;
  color: var(--red); text-shadow: 0 8px 30px rgba(214, 69, 95, .22);
}
.finale-line {
  max-width: 32rem; margin-bottom: .8rem;
  font: italic 400 clamp(1.15rem, 3vw, 1.4rem)/1.75 var(--font-serif);
}
.finale-sign { font-family: var(--font-script); font-size: 2.1rem; color: var(--rose); margin-bottom: 2rem; }

/* ---------- 8. Amplop & surat ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 40;
  display: grid; place-items: center;
  background: rgba(255, 241, 245, .86);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  opacity: 0; transition: opacity .5s var(--ease);
  padding: 16px;
}
.overlay.show { opacity: 1; }
.overlay > .envelope-stage, .overlay > .paper { grid-area: 1 / 1; }
.overlay-close {
  position: absolute; top: 14px; right: 16px; z-index: 5;
  width: 42px; height: 42px; border-radius: 50%; border: 0; cursor: pointer;
  background: rgba(255, 255, 255, .85); color: var(--red); font-size: 1.6rem; line-height: 1;
  box-shadow: 0 6px 16px -6px rgba(214, 69, 95, .5);
  transition: transform .3s var(--ease);
}
.overlay-close:hover { transform: rotate(90deg) scale(1.08); }

.envelope-stage {
  display: grid; place-items: center; gap: 2.4rem;
  transition: opacity .7s var(--ease), transform .7s var(--ease);
}
.overlay.reading .envelope-stage { opacity: 0; transform: translateY(40px) scale(.9); pointer-events: none; }
.env-hint { font: italic 400 1.15rem var(--font-serif); color: var(--ink-soft); animation: blinkSoft 1.6s ease-in-out infinite; }

.envelope {
  --w: min(330px, 78vw);
  position: relative; width: var(--w); height: calc(var(--w) * .68);
  perspective: 900px; margin-top: 7rem;
  opacity: 0; transform: translateY(30px) scale(.9);
  transition: opacity .9s var(--ease), transform .9s var(--ease);
}
.overlay.show .envelope { opacity: 1; transform: none; }
.env-back, .env-front, .env-flap, .env-letter { position: absolute; }
.env-back { inset: 0; border-radius: 8px; background: #f4b3c4; box-shadow: 0 26px 50px -22px rgba(214, 69, 95, .55); }
.env-letter {
  left: 7%; right: 7%; top: 6%; height: 88%; z-index: 2; border-radius: 4px;
  background: #fffdf8 repeating-linear-gradient(transparent 0 17px, rgba(236, 111, 142, .2) 17px 18px);
  box-shadow: 0 -2px 10px rgba(0, 0, 0, .06);
  transition: transform 1.1s var(--ease) .55s;
}
.envelope.open .env-letter { transform: translateY(-58%); }
.env-front {
  inset: 0; z-index: 3; border-radius: 0 0 8px 8px;
  background: #fbd3dc; clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
}
.env-front::before, .env-front::after { content: ""; position: absolute; inset: 0; }
.env-front::before { background: #f9c6d3; clip-path: polygon(0 0, 50% 52%, 0 100%); }
.env-front::after  { background: #f7bccb; clip-path: polygon(100% 0, 50% 52%, 100% 100%); }
.env-flap {
  top: 0; left: 0; width: 100%; height: 56%; z-index: 4;
  background: linear-gradient(#f59db5, #f8bccb);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center;
  transition: transform .8s var(--ease), z-index 0s .4s;
}
.envelope.open .env-flap { transform: rotateX(180deg); z-index: 1; }
.env-seal {
  position: absolute; left: 50%; top: 52%; z-index: 5;
  width: 44px; height: 44px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-size: 1.15rem;
  background: radial-gradient(circle at 35% 30%, #ff8fab, var(--red));
  box-shadow: 0 6px 14px -4px rgba(214, 69, 95, .75);
  transform: translate(-50%, -50%);
  transition: opacity .4s, transform .5s var(--ease);
}
.envelope.open .env-seal { opacity: 0; transform: translate(-50%, -50%) scale(.4); }

.paper {
  position: relative; width: min(92vw, 580px); max-height: 88vh; overflow-y: auto;
  padding: clamp(30px, 6vw, 52px) clamp(24px, 6vw, 50px);
  text-align: center; border-radius: 12px;
  background: linear-gradient(180deg, #fffefb, #fff8f0);
  border: 1px solid rgba(236, 111, 142, .2);
  box-shadow: 0 30px 70px -24px rgba(214, 69, 95, .5), inset 0 0 0 6px rgba(255, 228, 234, .6);
  opacity: 0; transform: translateY(30px) scale(.94); pointer-events: none;
  transition: opacity .8s var(--ease), transform .8s var(--ease);
}
.overlay.reading .paper { opacity: 1; transform: none; pointer-events: auto; transition-delay: .25s; }
.paper-title { font: 400 clamp(2.2rem, 7vw, 2.9rem)/1.15 var(--font-script); color: var(--red); margin-bottom: 1.1rem; }
.paper-body p { font: 500 clamp(1.3rem, 3.6vw, 1.5rem)/1.6 var(--font-hand); color: var(--ink); margin-bottom: .9em; }
.paper-closing { font: 500 1.4rem var(--font-hand); color: var(--ink-soft); margin-top: 1.2rem; }
.paper-sign { font: 400 2.1rem var(--font-script); color: var(--red); margin-bottom: 1.6rem; }

/* ---------- 9. Lightbox & tirai ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 45;
  display: grid; place-items: center; padding: 20px; cursor: zoom-out;
  background: rgba(106, 69, 83, .55);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; transition: opacity .4s var(--ease);
}
.lightbox.show { opacity: 1; }
.lightbox figure { background: #fff; padding: 14px 14px 8px; border-radius: 4px; text-align: center; max-width: 92vw; box-shadow: 0 30px 70px -20px rgba(0, 0, 0, .5); }
.lightbox img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; }
.lightbox figcaption { font: 500 1.5rem var(--font-hand); padding: 12px 8px; color: var(--ink); }

.curtain {
  position: fixed; inset: 0; z-index: 60; display: none; place-items: center;
  pointer-events: none;
  background: radial-gradient(circle at 50% 42%, #fff7f9, var(--pink-200) 62%, var(--pink-300));
  clip-path: circle(0 at 50% 50%);
}
.curtain span { font-size: 4.2rem; color: var(--red); animation: beat 1s ease-in-out infinite; }

/* ---------- 10. Animasi & responsif ---------- */
@keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes blinkSoft { 50% { opacity: .35; } }
@keyframes nudge { 0%, 100% { transform: rotate(45deg) translate(0, 0); } 50% { transform: rotate(45deg) translate(4px, 4px); } }
@keyframes eq { 0%, 100% { height: 3px; } 50% { height: 14px; } }

@media (max-width: 560px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 28px 14px; }
  .polaroid { padding: 8px 8px 0; }
  .polaroid figcaption { font-size: 1.08rem; padding: 10px 2px 14px; }
  .polaroid::before { width: 54px; margin-left: -27px; height: 18px; }
  .music-btn { top: 10px; right: 10px; padding: .5rem .85rem .5rem .75rem; }
  .btn { padding: 1rem 1.8rem; }
}
@media (min-width: 561px) and (max-width: 900px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); }
}

/* Hormati pengguna yang mengurangi gerakan */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

</style>
</head>

<!-- "locked" = scroll dikunci selama halaman pembuka tampil -->
<body class="locked">

  <!-- Kanvas efek: hati berterbangan, kelopak jatuh, bintang berkilau -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <!-- Tombol musik (Play / Pause) -->
  <button id="musicBtn" class="music-btn" type="button" aria-label="Putar musik">
    <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
    <span id="musicLabel">Putar</span>
  </button>

  <!-- =====================================================
       1. HALAMAN PEMBUKA
       ===================================================== -->
  <section id="intro" class="screen intro">
    <div class="beat-heart" aria-hidden="true">❤</div>
    <h1 class="intro-title">For Someone Special <span class="emoji">❤️</span></h1>

  <script>
/* =========================================================
   FOR SOMEONE SPECIAL  —  script.js

   BAGIAN 1 (CONFIG) adalah satu-satunya yang perlu kamu edit:
   nama, tanggal, isi ucapan, foto, surat, dan musik.
   Gunakan {name1}, {name2}, dan {from} di dalam teks —
   otomatis diganti dengan nama di bawah.
   ========================================================= */

/* ---------------------------------------------------------
   1. CONFIG  — GANTI ISINYA SESUAI KEBUTUHAN
   --------------------------------------------------------- */
const CONFIG = {
  // ===== Identitas =====
  name1: "Raka",                    // ← GANTI: nama pertama
  name2: "Alya",                    // ← GANTI: nama kedua
  from: "Sahabatmu",                // ← GANTI: nama pengirim
  date: "27 November 2026",         // ← GANTI: tanggal spesial

  // ===== Halaman pembuka =====
  introLine: "Ada kata-kata yang terlalu indah untuk dikirim lewat pesan biasa. Jadi aku menyimpannya di sini, khusus untuk kalian berdua.",

  // ===== Halaman ucapan (diketik otomatis) =====
  greetingTitle: "Selamat Berbahagia",
  greeting: [
    "Hari ini, dua hati yang saling memilih akhirnya berjalan ke arah yang sama.",
    "Selamat ya, {name1} dan {name2}. Melihat kalian bersama, aku percaya cinta yang tulus itu memang ada: sederhana, hangat, dan selalu tahu jalan pulang.",
    "Terima kasih sudah menunjukkan bahwa bahagia tidak harus ramai. Cukup dua orang yang saling menjaga dan tak pernah lelah untuk saling mengerti.",
    "Semoga hari-hari kalian ke depan terasa seperti hari ini: penuh senyum dan penuh syukur."
  ],
  greetingSign: "— {from}",
  typingSpeed: 30,                  // milidetik per huruf (makin kecil makin cepat)

  // ===== Galeri kenangan =====
  gallerySubtitle: "Potongan-potongan waktu yang membuat kalian menjadi kalian.",
  // src: isi dengan alamat foto, mis. "foto/1.jpg". Kosongkan = bingkai kosong
  // yang bisa diisi langsung dari perangkat (sementara, hilang saat dimuat ulang).
  photos: [
    { src: "", caption: "Awal dari semua cerita indah" },
    { src: "", caption: "Tawa yang selalu kami rindukan" },
    { src: "", caption: "Langkah kecil, bahagia yang besar" },
    { src: "", caption: "Genggaman yang tak pernah lepas" },
    { src: "", caption: "Senja dan kalian berdua" },
    { src: "", caption: "Dan perjalanan ini baru dimulai" }
  ],

  // ===== Pesan rahasia =====
  secretLead: "Masih ada sesuatu yang ingin kusampaikan, dengan cara yang lebih pelan.",
  letter: {
    title: "Untuk {name1} & {name2},",
    paragraphs: [
      "Pertama-tama, terima kasih. Terima kasih karena kalian sudah saling menemukan, lalu memilih untuk bertahan dan tumbuh bersama. Dari kalian aku belajar bahwa cinta bukan soal seberapa sempurna seseorang, tapi seberapa tulus ia mau pulang.",
      "Aku berharap rumah yang kalian bangun nanti selalu hangat; tempat paling nyaman untuk lelah, tertawa, dan menjadi diri sendiri. Semoga di hari yang berat kalian tetap saling menggenggam, dan di hari yang ringan kalian tidak lupa saling berterima kasih.",
      "Dalam doaku, semoga Tuhan menjaga kalian berdua: dilimpahkan kesehatan, rezeki yang cukup, dan hati yang selalu lapang. Semoga setiap air mata berubah jadi pelajaran, dan setiap tawa jadi kenangan yang kalian rawat sampai tua.",
      "Aku sayang kalian, sungguh. Bahagia kalian adalah bahagiaku juga. Jadi tolong, berbahagialah dengan sepenuh hati."
    ],
    closing: "Dengan segenap cinta,",
    signature: "{from}"
  },

  // ===== Halaman penutup =====
  finaleLine: "Terima kasih sudah mengizinkanku menjadi bagian kecil dari cerita besar kalian. Apa pun yang terjadi nanti, ingatlah: kalian dicintai, lebih banyak dari yang kalian sadari.",
  finaleSign: "Dengan cinta, {from}",

  // ===== Musik =====
  // Kosongkan "file" untuk memakai melodi lembut bawaan (tanpa file tambahan).
  // Atau isi dengan lagu sendiri, mis. "musik/lagu.mp3".
  music: { file: "", volume: 0.6 }
};


/* =========================================================
   Seluruh kode di bawah ini tidak perlu diubah
   ========================================================= */
(() => {
  'use strict';

  /* ---------------------------------------------------------
     2. Helper
     --------------------------------------------------------- */
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Ganti {name1}, {name2}, {from} di dalam teks
  const fill = str => String(str)
    .replaceAll('{name1}', CONFIG.name1)
    .replaceAll('{name2}', CONFIG.name2)
    .replaceAll('{from}', CONFIG.from);

  const body = document.body;
  const intro = $('#intro');
  const main = $('#main');

  /* ---------------------------------------------------------
     3. Isi konten dari CONFIG
     --------------------------------------------------------- */
  document.title = `For Someone Special ❤️ — ${CONFIG.name1} & ${CONFIG.name2}`;

  // Elemen dengan data-bind="kunci" diisi dari CONFIG[kunci]
  $$('[data-bind]').forEach(el => {
    el.textContent = fill(CONFIG[el.dataset.bind] ?? '');
  });
  $('#signature').textContent = fill(CONFIG.greetingSign);

  // Isi surat
  $('#paperTitle').textContent = fill(CONFIG.letter.title);
  $('#paperBody').innerHTML = CONFIG.letter.paragraphs
    .map(p => `<p>${fill(p).replace(/</g, '&lt;')}</p>`).join('');
  $('#paperClosing').textContent = fill(CONFIG.letter.closing);
  $('#paperSign').textContent = fill(CONFIG.letter.signature);

  /* ---------------------------------------------------------
     4. Efek partikel: hati, kelopak, bintang berkilau (canvas)
     --------------------------------------------------------- */
  const FX = (() => {
    const canvas = $('#fx');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, last = 0, intensity = 1;
    const items = [];    // partikel latar
    const bursts = [];   // ledakan sesaat

    const COLORS = {
      heart:   ['#f9aec2', '#f48fb1', '#ec6f8e', '#ffc2d1', '#d94a6b'],
      petal:   ['#ffd1dc', '#ffc0cb', '#ffe0e8', '#f8b8c8'],
      sparkle: ['#f6d58e', '#f9c6d3', '#ffe3a3', '#ffffff']
    };
    // Jumlah dasar partikel (menyesuaikan lebar layar)
    const base = () => {
      const small = W < 600;
      const k = reduceMotion ? 0.5 : 1;
      return {
        heart:   Math.round((small ? 8 : 14) * k),
        petal:   Math.round((small ? 9 : 16) * k),
        sparkle: Math.round((small ? 14 : 26) * k)
      };
    };

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawn(type, anywhere) {
      const p = { type, color: pick(COLORS[type]), rot: rand(0, 6.28), phase: rand(0, 6.28), x: rand(0, W) };
      if (type === 'heart') {
        Object.assign(p, { size: rand(8, 20), y: anywhere ? rand(0, H) : H + rand(20, 320),
          vy: -rand(26, 62), sway: rand(10, 30), alpha: rand(.35, .75), vr: rand(-.3, .3) });
      } else if (type === 'petal') {
        Object.assign(p, { size: rand(6, 12), y: anywhere ? rand(0, H) : -rand(20, 320),
          vy: rand(22, 48), sway: rand(20, 50), alpha: rand(.5, .85), vr: rand(-1.2, 1.2) });
      } else {
        Object.assign(p, { size: rand(3, 7), y: rand(0, H), speed: rand(.8, 2), vy: 0, sway: 0, alpha: 1, vr: 0 });
      }
      return p;
    }

    // Pertahankan jumlah partikel sesuai intensitas
    function topUp(initial) {
      const b = base();
      const target = {
        heart: Math.round(b.heart * intensity),
        petal: Math.round(b.petal * (1 + (intensity - 1) * .4)),
        sparkle: b.sparkle
      };
      for (const type of Object.keys(target)) {
        let count = 0;
        for (const p of items) if (p.type === type) count++;
        while (count < target[type]) { items.push(spawn(type, initial)); count++; }
      }
    }

    // Bentuk-bentuk (digambar di titik 0,0)
    function heartPath(s) {
      ctx.beginPath();
      ctx.moveTo(0, -s * .3);
      ctx.bezierCurveTo(-s * .1, -s * .6, -s * .6, -s * .6, -s * .6, -s * .1);
      ctx.bezierCurveTo(-s * .6, s * .3, 0, s * .55, 0, s * .8);
      ctx.bezierCurveTo(0, s * .55, s * .6, s * .3, s * .6, -s * .1);
      ctx.bezierCurveTo(s * .6, -s * .6, s * .1, -s * .6, 0, -s * .3);
      ctx.closePath();
    }
    function petalPath(s) {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo(s * .8, -s * .6, s * .8, s * .5, 0, s);
      ctx.bezierCurveTo(-s * .8, s * .5, -s * .8, -s * .6, 0, -s);
      ctx.closePath();
    }
    function starPath(s) {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.quadraticCurveTo(0, 0, s, 0);
      ctx.quadraticCurveTo(0, 0, 0, s);
      ctx.quadraticCurveTo(0, 0, -s, 0);
      ctx.quadraticCurveTo(0, 0, 0, -s);
      ctx.closePath();
    }

    function draw(p, alpha, size) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.fillStyle = p.color;
      if (p.type === 'sparkle') { ctx.shadowColor = '#f6c76b'; ctx.shadowBlur = 8; starPath(size); }
      else if (p.type === 'heart') heartPath(size);
      else petalPath(size);
      ctx.fill();
      ctx.restore();
    }

    function frame(t) {
      requestAnimationFrame(frame);
      if (document.hidden) { last = t; return; }
      const dt = Math.min((t - last) / 1000 || 0, .05);
      last = t;
      ctx.clearRect(0, 0, W, H);

      for (let i = items.length - 1; i >= 0; i--) {
        const p = items[i];
        if (p.type === 'sparkle') {
          p.phase += dt * p.speed;
          if (p.phase > 6.283) { p.phase -= 6.283; p.x = rand(0, W); p.y = rand(0, H); p.color = pick(COLORS.sparkle); }
          const a = Math.sin(p.phase / 2);            // 0 → 1 → 0 sekali per siklus
          p.rot += dt * .5;
          draw(p, a * a, p.size * (.4 + a * .9));
        } else {
          p.phase += dt * 1.2;
          p.x += Math.sin(p.phase) * p.sway * dt;
          p.y += p.vy * dt;
          p.rot += p.vr * dt;
          draw(p, p.alpha, p.size);
          if (p.y < -50 || p.y > H + 340) items.splice(i, 1);
        }
      }
      topUp(false);

      for (let i = bursts.length - 1; i >= 0; i--) {
        const b = bursts[i];
        b.life += dt;
        if (b.life >= b.max) { bursts.splice(i, 1); continue; }
        b.vx *= Math.pow(.2, dt); b.vy = b.vy * Math.pow(.2, dt) + 140 * dt;
        b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
        draw(b, 1 - b.life / b.max, b.size);
      }
    }

    /* API publik */
    function burst(x, y, n = 16) {
      for (let i = 0; i < n; i++) {
        const a = rand(0, 6.283), s = rand(60, 260);
        const type = Math.random() < .7 ? 'heart' : 'sparkle';
        bursts.push({
          type, color: pick(COLORS[type]), x, y,
          vx: Math.cos(a) * s, vy: Math.sin(a) * s - 60,
          size: type === 'heart' ? rand(7, 15) : rand(4, 8),
          rot: rand(0, 6.28), vr: rand(-3, 3), life: 0, max: rand(1.1, 2)
        });
      }
    }
    function setIntensity(v) { intensity = v; }

    window.addEventListener('resize', resize);
    resize(); topUp(true);
    requestAnimationFrame(frame);

    // Hati kecil mengikuti kursor, ledakan saat ditekan/diketuk
    let lastMove = 0;
    window.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || reduceMotion) return;
      const now = performance.now();
      if (now - lastMove < 70) return;
      lastMove = now; burst(e.clientX, e.clientY, 1);
    }, { passive: true });
    window.addEventListener('pointerdown', e => {
      if (e.target.closest('input, textarea')) return;
      burst(e.clientX, e.clientY, 6);
    }, { passive: true });

    return { burst, setIntensity };
  })();

  /* ---------------------------------------------------------
     5. Musik latar (Play / Pause)
        Tanpa file: melodi music-box lembut dibuat langsung
        oleh Web Audio. Dengan CONFIG.music.file: memutar file.
     --------------------------------------------------------- */
  const Music = (() => {
    const btn = $('#musicBtn'), label = $('#musicLabel');
    let playing = false;

    function ui() {
      btn.classList.toggle('playing', playing);
      label.textContent = playing ? 'Jeda' : 'Putar';
      btn.setAttribute('aria-label', playing ? 'Jeda musik' : 'Putar musik');
    }

    /* --- Opsi A: file audio --- */
    let audioEl = null;
    if (CONFIG.music.file) {
      audioEl = new Audio(CONFIG.music.file);
      audioEl.loop = true; audioEl.volume = CONFIG.music.volume ?? .6;
    }

    /* --- Opsi B: melodi bawaan (Web Audio) --- */
    let actx, master, delaySend, timer, step = 0, nextT = 0;
    const BPM = 68, EIGHTH = 60 / BPM / 2;
    const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
    // Progresi C – Am – F – G (nomor MIDI)
    const CHORDS = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
    const BASS = [48, 45, 41, 43];
    const ARP = [0, 1, 2, 3, 2, 1, 2, 3];
    const MELODY = [
      [79, 0, 0, 76, 0, 0, 72, 0], [0, 72, 0, 0, 76, 0, 0, 74],
      [77, 0, 0, 72, 0, 0, 69, 0], [0, 74, 0, 71, 0, 0, 67, 0]
    ];

    function setupAudio() {
      if (actx) return;
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0;
      master.connect(actx.destination);
      // gema lembut
      const delay = actx.createDelay(1); delay.delayTime.value = .43;
      const fb = actx.createGain(); fb.gain.value = .36;
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      delaySend = actx.createGain(); delaySend.gain.value = .32;
      delaySend.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
    }

    function tone(freq, t, dur, vol, type = 'sine') {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(master); g.connect(delaySend);
      o.start(t); o.stop(t + dur + .05);
    }

    function scheduleStep(s, t) {
      const bar = Math.floor(s / 8) % 4, i = s % 8;
      tone(mtof(CHORDS[bar][ARP[i]]), t, 1.6, .16);                        // arpeggio
      tone(mtof(CHORDS[bar][ARP[i]] + 12), t, .9, .035, 'triangle');       // kilau oktaf
      if (i === 0) tone(mtof(BASS[bar]), t, 2.6, .2, 'triangle');          // bass
      const m = MELODY[bar][i];
      if (m) tone(mtof(m), t, 1.8, .11);                                   // melodi
    }

    function scheduler() {
      while (nextT < actx.currentTime + .35) {
        scheduleStep(step, nextT);
        nextT += EIGHTH; step = (step + 1) % 32;
      }
    }

    function play() {
      if (playing) return;
      playing = true; ui();
      if (audioEl) { audioEl.play().catch(() => { playing = false; ui(); }); return; }
      setupAudio();
      actx.resume();
      nextT = actx.currentTime + .08;
      master.gain.cancelScheduledValues(actx.currentTime);
      master.gain.setTargetAtTime(CONFIG.music.volume ?? .6, actx.currentTime, .4);
      clearInterval(timer); timer = setInterval(scheduler, 110);
    }

    function pause() {
      if (!playing) return;
      playing = false; ui();
      if (audioEl) { audioEl.pause(); return; }
      clearInterval(timer);
      master.gain.setTargetAtTime(0, actx.currentTime, .15);
      setTimeout(() => { if (!playing) actx.suspend(); }, 600);
    }

    btn.addEventListener('click', () => (playing ? pause() : play()));
    ui();
    return { play, pause };
  })();

  /* ---------------------------------------------------------
     6. Efek mengetik (halaman ucapan)
     --------------------------------------------------------- */
  let typed = false, typingToken = 0, skipTyping = false;
  const sig = $('#signature');

  async function runTyping() {
    if (typed) return;
    typed = true; skipTyping = false;
    const token = ++typingToken;
    const box = $('#typedText');
    box.innerHTML = ''; sig.classList.remove('show');

    // Siapkan semua paragraf dulu (teks cadangan tak terlihat menjaga tinggi kartu)
    const parts = CONFIG.greeting.map(raw => {
      const text = fill(raw);
      const p = document.createElement('p');
      const a = document.createElement('span'); a.className = 't';
      const b = document.createElement('span'); b.className = 'g'; b.textContent = text;
      p.append(a, b); box.appendChild(p);
      return { p, a, b, text };
    });

    for (const part of parts) {
      part.p.classList.add('is-typing');
      for (let i = 1; i <= part.text.length; i++) {
        if (token !== typingToken) return;
        if (skipTyping) { part.a.textContent = part.text; part.b.textContent = ''; break; }
        part.a.textContent = part.text.slice(0, i);
        part.b.textContent = part.text.slice(i);
        await sleep(CONFIG.typingSpeed + (/[,.:]/.test(part.text[i - 1]) ? 140 : 0));
      }
      part.p.classList.remove('is-typing');
      if (!skipTyping) await sleep(300);
    }
    if (token !== typingToken) return;
    sig.classList.add('show');
  }
  // Ketuk kartu = tampilkan seluruh teks sekarang
  $('#greetingCard').addEventListener('click', () => { skipTyping = true; });

  /* ---------------------------------------------------------
     7. Transisi halaman (tirai lingkaran yang melebar)
     --------------------------------------------------------- */
  const curtain = $('#curtain');
  let transitioning = false;

  async function transition(x, y, swap) {
    if (transitioning) return;
    transitioning = true;
    curtain.style.display = 'grid';
    curtain.style.transition = 'none';
    curtain.style.opacity = '1';
    curtain.style.clipPath = `circle(0px at ${x}px ${y}px)`;
    void curtain.offsetWidth;                                    // paksa reflow
    curtain.style.transition = 'clip-path .9s cubic-bezier(.65,0,.35,1)';
    curtain.style.clipPath = `circle(150vmax at ${x}px ${y}px)`;
    await sleep(1100);

    swap();                                                      // ganti halaman di balik tirai
    await sleep(350);

    curtain.style.transition = 'opacity .9s ease';
    curtain.style.opacity = '0';
    await sleep(950);
    curtain.style.display = 'none';
    transitioning = false;
  }

  const centerOf = el => {
    const r = el.getBoundingClientRect();
    return [r.left + r.width / 2, r.top + r.height / 2];
  };

  /* ---------------------------------------------------------
     8. Buka pesan (halaman pembuka → konten utama)
     --------------------------------------------------------- */
  $('#openBtn').addEventListener('click', e => {
    const [x, y] = centerOf(e.currentTarget);
    FX.burst(x, y, 28);
    Music.play();                                               // musik mulai (butuh interaksi pengguna)
    transition(x, y, () => {
      intro.hidden = true;
      main.hidden = false;
      body.classList.remove('locked');
      window.scrollTo(0, 0);
    });
  });

  /* ---------------------------------------------------------
     9. Animasi muncul saat menggulir + pemicu per bagian
     --------------------------------------------------------- */
  const revealIO = new IntersectionObserver(entries => {
    entries.forEach(en => { if (en.isIntersecting) en.target.classList.add('visible'); });
  }, { threshold: .15, rootMargin: '0px 0px -8% 0px' });
  const watchReveals = () => $$('.reveal').forEach(el => revealIO.observe(el));

  // Mulai mengetik saat kartu ucapan terlihat
  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) runTyping();
  }, { threshold: .4 }).observe($('#greetingCard'));

  // Hati lebih ramai di halaman penutup
  new IntersectionObserver(entries => {
    if (entries[0].isIntersecting) {
      FX.setIntensity(2.6);
      FX.burst(innerWidth / 2, innerHeight * .4, 30);
    } else FX.setIntensity(1);
  }, { threshold: .5 }).observe($('#finale'));

  /* ---------------------------------------------------------
     10. Galeri polaroid (+ tambah foto + lightbox)
     --------------------------------------------------------- */
  const grid = $('#galleryGrid');
  const rotations = [-3.5, 2.5, -2, 3, -3, 2];

  function setPhoto(photoEl, src, caption) {
    photoEl.innerHTML = '';
    const img = document.createElement('img');
    img.src = src; img.alt = caption; img.loading = 'lazy';
    photoEl.appendChild(img);
    photoEl.dataset.has = '1';
    photoEl.dataset.src = src;
  }

  CONFIG.photos.forEach((ph, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'pol-wrap reveal';
    wrap.style.setProperty('--d', `${(i % 3) * .12}s`);

    const fig = document.createElement('figure');
    fig.className = 'polaroid';
    fig.style.setProperty('--rot', `${rotations[i % rotations.length]}deg`);
    fig.tabIndex = 0; fig.setAttribute('role', 'button');
    fig.setAttribute('aria-label', `Foto kenangan: ${ph.caption}`);

    const photo = document.createElement('div'); photo.className = 'photo';
    const cap = document.createElement('figcaption'); cap.textContent = fill(ph.caption);

    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*'; input.hidden = true;

    const change = document.createElement('button');
    change.type = 'button'; change.className = 'change-photo';
    change.textContent = '✎'; change.setAttribute('aria-label', 'Ganti foto');
    change.addEventListener('click', e => { e.stopPropagation(); input.click(); });

    if (ph.src) setPhoto(photo, ph.src, ph.caption);
    else photo.innerHTML = '<div class="photo-empty"><b>❤</b><span>Tambah foto</span></div>';

    // Pilih foto dari perangkat
    let objectUrl = null;
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      if (!file) return;
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      setPhoto(photo, objectUrl, ph.caption);
      FX.burst(...centerOf(photo), 12);
    });

    // Klik: bingkai kosong → pilih foto; sudah ada foto → perbesar
    const activate = () => {
      if (photo.dataset.has) openLightbox(photo.dataset.src, fill(ph.caption));
      else input.click();
    };
    fig.addEventListener('click', activate);
    fig.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); }
    });

    fig.append(change, photo, cap, input);
    wrap.appendChild(fig);
    grid.appendChild(wrap);
  });

  const lightbox = $('#lightbox');
  function openLightbox(src, caption) {
    $('#lbImg').src = src; $('#lbImg').alt = caption;
    $('#lbCap').textContent = caption;
    lightbox.hidden = false;
    requestAnimationFrame(() => lightbox.classList.add('show'));
  }
  function closeLightbox() {
    lightbox.classList.remove('show');
    setTimeout(() => { lightbox.hidden = true; }, 400);
  }
  lightbox.addEventListener('click', closeLightbox);

  /* ---------------------------------------------------------
     11. Pesan rahasia: amplop terbuka → surat
     --------------------------------------------------------- */
  const overlay = $('#letterOverlay');
  const envelope = $('#envelope');
  let letterTimers = [];
  const later = (ms, fn) => letterTimers.push(setTimeout(fn, ms));
  const clearLater = () => { letterTimers.forEach(clearTimeout); letterTimers = []; };

  function openLetter() {
    clearLater();
    overlay.hidden = false;
    overlay.classList.remove('reading');
    envelope.classList.remove('open');
    $('#paper').scrollTop = 0;
    body.classList.add('no-scroll');
    requestAnimationFrame(() => requestAnimationFrame(() => overlay.classList.add('show')));

    later(1000, () => envelope.classList.add('open'));            // tutup amplop terbuka
    later(2900, () => {                                           // surat keluar & membesar
      overlay.classList.add('reading');
      FX.burst(innerWidth / 2, innerHeight / 2, 28);
    });
    later(3600, () => $('#letterClose').focus({ preventScroll: true }));
  }

  function closeLetter() {
    clearLater();
    overlay.classList.remove('show', 'reading');
    body.classList.remove('no-scroll');
    later(550, () => { overlay.hidden = true; envelope.classList.remove('open'); });
  }

  $('#letterBtn').addEventListener('click', openLetter);
  $('#letterClose').addEventListener('click', closeLetter);
  $('#paperClose').addEventListener('click', closeLetter);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeLetter(); });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!lightbox.hidden) closeLightbox();
    else if (!overlay.hidden) closeLetter();
  });

  /* ---------------------------------------------------------
     12. Ulangi dari awal
     --------------------------------------------------------- */
  $('#restartBtn').addEventListener('click', e => {
    const [x, y] = centerOf(e.currentTarget);
    FX.burst(x, y, 20);
    transition(x, y, () => {
      // reset keadaan
      typed = false; typingToken++; skipTyping = false;
      $('#typedText').innerHTML = ''; sig.classList.remove('show');
      $$('.reveal').forEach(el => el.classList.remove('visible'));
      FX.setIntensity(1);
      main.hidden = true;
      intro.hidden = false;                                       // animasi pembuka berulang otomatis
      body.classList.add('locked');
      window.scrollTo(0, 0);
    });
  });

  /* ---------------------------------------------------------
     Mulai
     --------------------------------------------------------- */
  watchReveals();
})();

</script>
</body>
</html>
